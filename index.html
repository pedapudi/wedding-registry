<style>
  :root {
    --bg:        #0b3a47;
    --bg-soft:   #0e424f;
    --cream:     #f4efe8;
    --gold:      #c99a78;
    --gold-soft: #d9b696;
    --gold-line: rgba(201, 154, 120, 0.38);
    --gold-dim:  rgba(201, 154, 120, 0.18);
    --text:      #c4d0d1;
    --text-dim:  #8ba0a3;
    --shadow:    rgba(0, 0, 0, 0.28);
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Quicksand', sans-serif;
    -webkit-font-smoothing: antialiased;
    line-height: 1.6;
  }

  /* ---------- Hero ---------- */
  .hero { text-align: center; padding: 90px 24px 40px; max-width: 900px; margin: 0 auto; }
  .names { font-family: 'Jost', sans-serif; font-weight: 200; color: var(--gold-soft); letter-spacing: 0.18em; }
  .names .line { font-size: clamp(2.8rem, 11vw, 6.2rem); line-height: 1.05; }
  .amp-row { display: flex; align-items: center; justify-content: center; gap: 22px; margin: 18px auto; max-width: 520px; }
  .amp-row .rule { flex: 1; height: 1px; background: var(--gold-line); }
  .amp-row .amp { font-family: 'Jost', sans-serif; font-weight: 300; font-size: 1.9rem; color: var(--gold); }
  .eyebrow {
    font-family: 'Jost', sans-serif; font-weight: 300; letter-spacing: 0.55em;
    text-transform: uppercase; font-size: clamp(1.1rem, 3.5vw, 1.6rem); color: var(--gold);
    margin: 30px 0 0; padding-left: 0.55em;
  }
  .intro { color: var(--text); font-size: 1.05rem; max-width: 620px; margin: 26px auto 0; }
  .center-rule { width: 130px; height: 1px; background: var(--gold-line); margin: 38px auto 0; }
  .progress {
    text-align: center; font-family: 'Jost', sans-serif; font-weight: 300; letter-spacing: 0.22em;
    text-transform: uppercase; font-size: 0.8rem; color: var(--text-dim); margin: 28px 0 0;
  }

  /* ---------- Sections ---------- */
  main { max-width: 1180px; margin: 0 auto; padding: 30px 24px 110px; }
  .category { margin-top: 64px; }
  .category-head { display: flex; align-items: center; gap: 20px; margin-bottom: 30px; }
  .category-head .cat-title { display: flex; flex-direction: column; gap: 5px; }
  .category-head h2 {
    font-family: 'Jost', sans-serif; font-weight: 300; letter-spacing: 0.3em; text-transform: uppercase;
    font-size: clamp(1rem, 2.4vw, 1.35rem); color: var(--gold-soft); margin: 0; white-space: nowrap;
  }
  .category-head .cat-sub {
    font-family: 'Quicksand', sans-serif; font-weight: 400; font-style: italic;
    font-size: 0.82rem; letter-spacing: 0.02em; color: var(--text-dim);
  }
  .category-head .rule { flex: 1; height: 1px; background: var(--gold-dim); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }

  /* ---------- Cards ---------- */
  .card {
    position: relative; background: var(--bg-soft); border: 1px solid var(--gold-dim); border-radius: 3px;
    overflow: hidden; display: flex; flex-direction: column;
    transition: border-color 0.25s ease, transform 0.25s ease, box-shadow 0.25s ease;
  }
  .card:hover { border-color: var(--gold-line); transform: translateY(-4px); box-shadow: 0 16px 34px var(--shadow); }
  .photo { display: block; height: 188px; background: var(--cream); border-bottom: 1px solid var(--gold-line); overflow: hidden; position: relative; }
  .photo img { width: 100%; height: 100%; object-fit: contain; padding: 16px; transition: transform 0.4s ease; }
  a.photo:hover img { transform: scale(1.05); }
  a.photo::after {
    content: "↗"; position: absolute; top: 10px; right: 12px; font-family: 'Jost', sans-serif;
    font-size: 0.95rem; color: var(--bg); background: rgba(244,239,232,0.85); border-radius: 50%;
    width: 26px; height: 26px; display: flex; align-items: center; justify-content: center;
    opacity: 0; transition: opacity 0.25s ease;
  }
  a.photo:hover::after { opacity: 1; }
  .body { padding: 18px 20px 18px; display: flex; flex-direction: column; flex: 1; }
  .name { font-family: 'Jost', sans-serif; font-weight: 400; font-size: 1.14rem; letter-spacing: 0.02em; color: #eaf1f1; margin: 0 0 4px; text-decoration: none; display: block; }
  a.name:hover { color: var(--gold-soft); }
  .vendor { font-size: 0.7rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--text-dim); }
  .spacer { flex: 1; min-height: 14px; }
  .pricerow { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .price { font-family: 'Jost', sans-serif; font-weight: 400; font-size: 1.4rem; color: var(--gold-soft); letter-spacing: 0.02em; }
  .price .qty { font-family: 'Quicksand', sans-serif; font-size: 0.78rem; color: var(--text-dim); letter-spacing: 0.04em; margin-left: 5px; }
  .view {
    font-family: 'Jost', sans-serif; font-weight: 400; letter-spacing: 0.1em; text-transform: uppercase;
    font-size: 0.68rem; color: var(--gold); text-decoration: none; white-space: nowrap;
    border-bottom: 1px solid transparent; transition: border-color 0.2s, color 0.2s;
  }
  .view:hover { color: var(--gold-soft); border-color: var(--gold-soft); }
  .card-foot { display: flex; align-items: center; justify-content: space-between; margin-top: 16px; }
  .badge {
    font-family: 'Jost', sans-serif; font-weight: 400; letter-spacing: 0.18em; text-transform: uppercase;
    font-size: 0.64rem; padding: 6px 13px; border: 1px solid var(--gold-line); border-radius: 999px; color: var(--gold-soft);
  }
  .claim {
    font-family: 'Jost', sans-serif; font-weight: 400; letter-spacing: 0.13em; text-transform: uppercase;
    font-size: 0.64rem; color: var(--gold); text-decoration: none; cursor: pointer;
    background: none; border: none; padding: 0; margin: 0; appearance: none; -webkit-appearance: none;
    border-bottom: 1px solid transparent; transition: border-color 0.2s, color 0.2s;
  }
  .claim:hover { border-color: var(--gold); color: var(--gold-soft); }

  /* Claimed state */
  .card.claimed { opacity: 0.5; }
  .card.claimed .name { text-decoration: line-through; color: var(--text-dim); }
  .card.claimed .price { color: var(--text-dim); }
  .card.claimed .badge { color: var(--text-dim); border-color: rgba(139,160,163,0.4); }

  /* ---------- Footer ---------- */
  footer { text-align: center; padding: 0 24px 90px; }
  footer .center-rule { margin: 0 auto 30px; }
  footer p { color: var(--text-dim); font-size: 0.92rem; max-width: 560px; margin: 0 auto 26px; }
  .btn {
    display: inline-block; font-family: 'Jost', sans-serif; font-weight: 300; letter-spacing: 0.28em;
    text-transform: uppercase; font-size: 0.95rem; color: var(--gold-soft); text-decoration: none;
    padding: 16px 42px; padding-right: calc(42px - 0.28em); border: 1px solid var(--gold-line);
    border-radius: 2px; transition: background 0.25s, color 0.25s;
  }
  .btn:hover { background: var(--gold); color: var(--bg); border-color: var(--gold); }

  /* ---------- Claim modal ---------- */
  .overlay {
    position: fixed; inset: 0; background: rgba(4,22,28,0.74); backdrop-filter: blur(3px);
    display: none; align-items: center; justify-content: center; padding: 24px; z-index: 50;
  }
  .overlay.open { display: flex; }
  .modal {
    background: var(--bg-soft); border: 1px solid var(--gold-line); border-radius: 4px;
    max-width: 420px; width: 100%; padding: 34px 30px 28px; text-align: center; box-shadow: 0 24px 60px rgba(0,0,0,0.5);
  }
  .modal h3 { font-family: 'Jost', sans-serif; font-weight: 300; letter-spacing: 0.22em; text-transform: uppercase; color: var(--gold); font-size: 0.8rem; margin: 0 0 8px; }
  .modal .mg-name { font-family: 'Jost', sans-serif; font-weight: 400; color: #eaf1f1; font-size: 1.5rem; margin: 0 0 22px; }
  .modal label { display: block; font-size: 0.8rem; letter-spacing: 0.02em; color: var(--text-dim); margin: 0 0 8px; text-align: left; }
  .modal input {
    width: 100%; background: rgba(255,255,255,0.05); border: 1px solid var(--gold-dim); border-radius: 2px;
    color: #eaf1f1; font-family: 'Quicksand', sans-serif; font-size: 1rem; padding: 11px 13px; outline: none;
  }
  .modal input:focus { border-color: var(--gold-line); }
  .modal input + label { margin-top: 18px; }
  .modal .mg-error { font-size: 0.8rem; color: var(--gold-soft); text-align: left; margin: 10px 0 0; }
  .modal .actions { display: flex; gap: 12px; margin-top: 22px; }
  .modal button {
    flex: 1; font-family: 'Jost', sans-serif; font-weight: 300; letter-spacing: 0.18em; text-transform: uppercase;
    font-size: 0.78rem; padding: 13px; border-radius: 2px; cursor: pointer; transition: all 0.2s;
  }
  .modal .confirm { background: var(--gold); color: var(--bg); border: 1px solid var(--gold); }
  .modal .confirm:hover { background: var(--gold-soft); border-color: var(--gold-soft); }
  .modal .cancel { background: transparent; color: var(--text-dim); border: 1px solid var(--gold-dim); }
  .modal .cancel:hover { color: var(--text); border-color: var(--gold-line); }
  .modal .note { font-size: 0.72rem; color: var(--text-dim); margin: 18px 0 0; line-height: 1.5; }

  .toast {
    position: fixed; left: 50%; bottom: 34px; transform: translateX(-50%) translateY(20px);
    background: var(--bg-soft); border: 1px solid var(--gold-line); color: var(--text); font-size: 0.92rem;
    padding: 13px 22px; border-radius: 3px; box-shadow: 0 14px 34px rgba(0,0,0,0.45);
    opacity: 0; pointer-events: none; transition: opacity 0.3s, transform 0.3s; z-index: 60; max-width: 90vw; text-align: center;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 540px) { .hero { padding-top: 64px; } main { padding-bottom: 70px; } }
</style>

    { key: "Kimwipes for Sunil's projects", name: "Kimwipes", vendor: "Workshop", price: "$16", qty: "per box", cat: "For Sunil’s Projects", img: "registry-assets/gift-30.webp", buy: "" },
    { key: "Foam Tip Cleaners for Sunil's projects", name: "Foam Tip Cleaners", vendor: "Workshop", price: "$14", qty: "", cat: "For Sunil’s Projects", img: "registry-assets/gift-31.webp", buy: "" },
    { key: "Engineer Curved Tip Tweezers for Sunil's projects", name: "Curved Tip Tweezers", vendor: "Workshop", price: "$42", qty: "", cat: "For Sunil’s Projects", img: "registry-assets/gift-32.webp", buy: "" },
    { key: "Engineer Tweezers for Sunil's projects", name: "Precision Tweezers", vendor: "Workshop", price: "$59", qty: "", cat: "For Sunil’s Projects", img: "registry-assets/gift-33.webp", buy: "" },
    { key: "ESP32 microcontrollers for Sunil's projects", name: "ESP32 Microcontrollers", vendor: "Workshop", price: "$23", qty: "", cat: "For Sunil’s Projects", img: "registry-assets/gift-34.webp", buy: "" },
  ];
  // --- end gift list ---

  const CATEGORY_ORDER = [
    "Table & Linens", "Studio Arhoj Ceramics", "The Kitchen", "The Outdoors", "For Sunil’s Projects",
  ];
  const CATEGORY_SUBTITLES = {
    "For Sunil’s Projects": "(which sometimes Gretl gets dragged into)",
  };

  // ============================================================
  //  WIRING
  // ============================================================
  const liveEnabled = () => /^https:\/\//.test(WEBAPP_URL);
  const escAttr = s => String(s).replace(/&/g, "&amp;").replace(/"/g, "&quot;");
  const escHtml = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const catalog = document.getElementById("catalog");
  const overlay = document.getElementById("overlay");
  const CLAIMED_RE = /claim|purchas|taken|bought|reserved/i;

  // A gift bought through the Amazon registry ships to the address Amazon already holds.
  // Every other gift the guest sends themselves, so the thank-you mail has to carry our
  // address and the claim has to collect somewhere to send it. apps-script/Code.gs applies
  // this same test server-side when it decides what goes in the mail; keep the two in step.
  const AMAZON_REGISTRY_RE = /amazon\.[a-z.]+\/wedding\//i;
  const needsShipping = it => !AMAZON_REGISTRY_RE.test(it.buy || "");
  const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

  function buildCard(it) {
    const claimed = it.status === "claimed";
    const href = it.buy ? `href="${escAttr(it.buy)}" target="_blank" rel="noopener"` : "";
    // A gift added to the Sheet has no photo until one is committed; show the empty tile.
    const img = it.img ? `<img src="${escAttr(it.img)}" alt="${escAttr(it.name)}" loading="lazy">` : "";
    const photo = it.buy
      ? `<a class="photo" ${href}>${img}</a>`
      : `<div class="photo">${img}</div>`;
    const title = it.buy
      ? `<a class="name" ${href}>${escHtml(it.name)}</a>`
      : `<span class="name">${escHtml(it.name)}</span>`;
    const priceBlock = it.price
      ? `<span class="price">${escHtml(it.price)}${it.qty ? `<span class="qty">${escHtml(it.qty)}</span>` : ""}</span>`
      : `<span class="price" style="font-size:1.0rem;color:var(--text-dim)">Ask us</span>`;
    const view = (it.buy && !claimed) ? `<a class="view" ${href}>View ↗</a>` : "";
    // Live mode → a real button (no mailto). Static mode → mailto fallback so guests can still reach you.
    const claimEl = claimed ? "" : (liveEnabled()
      ? `<button type="button" class="claim" data-key="${escAttr(it.key)}">I’ll get this →</button>`
      : `<a class="claim" data-key="${escAttr(it.key)}" href="mailto:${CLAIM_EMAIL}?subject=${encodeURIComponent("Registry — " + it.name)}">I’ll get this →</a>`);
    const vendor = it.vendor ? `<span class="vendor">${escHtml(it.vendor)}</span>` : "";
    return `${photo}<div class="body">${title}${vendor}` +
           `<div class="spacer"></div><div class="pricerow">${priceBlock}${view}</div>` +
           `<div class="card-foot"><span class="badge">${claimed ? "Claimed" : "Available"}</span>${claimEl}</div></div>`;
  }

  function render() {
    catalog.innerHTML = "";
    const groups = {};
    ITEMS.forEach(it => (groups[it.cat] ||= []).push(it));
    // A gift the sync added from the Sheet carries a category that is not in the order
    // above; show those last rather than dropping them off the page.
    const cats = CATEGORY_ORDER.filter(c => groups[c])
      .concat(Object.keys(groups).filter(c => !CATEGORY_ORDER.includes(c)));
    cats.forEach(cat => {
      const sub = CATEGORY_SUBTITLES[cat];
      const section = document.createElement("section");
      section.className = "category";
      const head = document.createElement("div");
      head.className = "category-head";
      head.innerHTML = `<div class="cat-title"><h2>${escHtml(cat)}</h2>${sub ? `<span class="cat-sub">${escHtml(sub)}</span>` : ""}</div><span class="rule"></span>`;
      section.appendChild(head);
      const grid = document.createElement("div");
      grid.className = "grid";
      groups[cat].forEach(it => {
        const card = document.createElement("div");
        card.className = "card" + (it.status === "claimed" ? " claimed" : "");
        card.innerHTML = buildCard(it);
        grid.appendChild(card);
      });
      section.appendChild(grid);
      catalog.appendChild(section);
    });
    const total = ITEMS.length;
    const available = ITEMS.filter(i => i.status !== "claimed").length;
    document.getElementById("progress").textContent = `${available} of ${total} gifts still available`;
  }

  // Intercept claim clicks only in live mode; otherwise the mailto link works as-is.
  catalog.addEventListener("click", e => {
    const a = e.target.closest(".claim");
    if (!a || !liveEnabled()) return;
    e.preventDefault();
    const it = ITEMS.find(x => x.key === a.getAttribute("data-key"));
    if (it) openClaim(it);
  });

  function applyStatusMap(map) {
    if (!map) return;
    ITEMS.forEach(it => {
      const s = map[it.key];
      if (s) it.status = (s.claimed || CLAIMED_RE.test(s.status || "")) ? "claimed" : "available";
    });
  }

  async function refreshStatus() {
    if (!liveEnabled()) return;
    try {
      const url = WEBAPP_URL + (WEBAPP_URL.includes("?") ? "&" : "?") + "t=" + Date.now();
      const r = await fetch(url, { redirect: "follow" });
      applyStatusMap(await r.json());
      render();
    } catch (_) { /* keep current view */ }
  }

  // ---- Claim modal ----
  function openClaim(it) {
    if (it.status === "claimed") { toast("That one’s already claimed 🤍"); return; }
    const ship = needsShipping(it);
    const emailHint = ship
      ? "— required, so we can send you our address"
      : "— optional, so we can say thank you";
    overlay.innerHTML =
      `<div class="modal">
         <h3>Claim this gift</h3>
         <p class="mg-name">${escHtml(it.name)}</p>
         <label for="who">Your name <span style="opacity:.65">— so we know who to thank (optional)</span></label>
         <input id="who" type="text" maxlength="60" placeholder="e.g. Aunt Sue" autocomplete="name">
         <label for="guestEmail">Your email <span style="opacity:.65">${emailHint}</span></label>
         <input id="guestEmail" type="email" maxlength="120" placeholder="you@example.com" autocomplete="email">
         <p class="mg-error" id="mErr" hidden></p>
         <div class="actions">
           <button class="cancel" id="mCancel">Cancel</button>
           <button class="confirm" id="mOk">Claim it</button>
         </div>
         <p class="note">This marks it off Gretl &amp; Sunil’s list so it won’t be gifted twice.${
           ship ? " This one comes to us directly, so we’ll email you our address." : ""}</p>
       </div>`;
    overlay.classList.add("open");
    const who = overlay.querySelector("#who");
    const email = overlay.querySelector("#guestEmail");
    const err = overlay.querySelector("#mErr");
    setTimeout(() => who.focus(), 50);

    function attempt() {
      const address = email.value.trim();
      if (ship && !address) return fail("We need an email address to send you our address.");
      if (address && !EMAIL_RE.test(address)) return fail("That email address does not look right.");
      submitClaim(it, who.value.trim(), address);
    }
    function fail(msg) { err.textContent = msg; err.hidden = false; email.focus(); }

    overlay.querySelector("#mCancel").onclick = closeModal;
    overlay.querySelector("#mOk").onclick = attempt;
    [who, email].forEach(input => {
      input.onkeydown = e => {
        if (e.key === "Enter") attempt();
        if (e.key === "Escape") closeModal();
      };
    });
    overlay.onclick = e => { if (e.target === overlay) closeModal(); };
  }
  function closeModal() { overlay.classList.remove("open"); overlay.innerHTML = ""; overlay.onclick = null; }

  async function submitClaim(it, who, email) {
    const wasStatus = it.status;
    it.status = "claimed";          // optimistic
    render();
    closeModal();
    toast(`You claimed “${it.name}” 🤍 Thank you!`);
    if (!liveEnabled()) return;
    try {
      const r = await fetch(WEBAPP_URL, {
        method: "POST",
        body: JSON.stringify({ action: "claim", name: it.key, who: who || "", email: email || "", buy: it.buy || "" }),
      });
      const res = await r.json();
      if (res && res.status) { applyStatusMap(res.status); render(); }
      if (res && res.ok === false) {
        if (res.error === "already") {
          toast(`Oh — someone just claimed “${it.name}” first.`, 6000);
        } else {
          // The Sheet did not record it. Put the card back so nobody thinks it is taken.
          if (!res.status) { it.status = wasStatus; render(); }
          toast(`We could not record “${it.name}”. Please email ${CLAIM_EMAIL} and we’ll sort it out.`, 9000);
        }
      }
    } catch (_) {
      setTimeout(refreshStatus, 1500);   // reconcile against the Sheet's truth
    }
  }

  // ---- Toast ----
  let toastTimer;
  function toast(msg, ms) {
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove("show"), ms || 3800);
  }

  // ---- Init ----
  render();
  refreshStatus();
  if (liveEnabled()) setInterval(refreshStatus, 60000);
</script>
</body>
</html>
